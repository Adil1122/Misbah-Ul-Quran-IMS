    <script>
      // Gracefully handle benign Vite HMR websocket disconnection in cloud proxy environments
      (function() {
        var suppress = function(str) {
          if (!str || typeof str !== 'string') return false;
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf('failed to connect to websocket') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (suppress(reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (suppress(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          var allText = Array.prototype.slice.call(arguments).map(function(arg) {
            return (arg && arg.message) ? arg.message : String(arg);
          }).join(' ');
          if (suppress(allText)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
